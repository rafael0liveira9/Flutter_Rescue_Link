name: flutter_health
description: A new Flutter project.

publish_to: "none" 

version: 1.0.0+1

environment:
  sdk: ">=3.1.3 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.2.8+1
  path: ^1.8.3
  cupertino_icons: ^1.0.2
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  intl: ^0.19.0
  fluttertoast: ^8.2.1
  localstorage: "^4.0.1+4"
  get: ^4.6.6
  shared_preferences: ^2.2.3
  http: ^0.13.3
  pdf: ^3.10.3
  path_provider: ^2.0.15
  open_file: ^3.2.1
  win32: ^5.13.0


dev_dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-home.png"
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: "assets/images/icon-home.png"


flutter:

  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo-2.png
    - assets/images/icon-home.png

dependency_overrides:
  win32: ^5.13.0
  path_provider_windows: ^2.0.0
